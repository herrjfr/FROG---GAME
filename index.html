<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://publicawesome.web.app/assets/fontawesome/css/all.css">
</head>
<body>
    <audio src="./img/frog-sound.mp3"></audio>
    <button class="reload"><i class="fa-notdog-duo fa-solid fa-refresh"></i></button>
    <button class="info"><i class="fa-notdog-duo fa-solid fa-circle-info"></i></button>
    <h1 class="second"></h1>
    <h1 class="level"></h1>
    <h1 class="score"></h1>
    <div class="main">
        <div class="info-text">
            <ul>
                <li>Level 1 - (0-20)</li>
                <li>Level 2 - (21-50)</li>
                <li>Level 3 - (51-85)</li>
            </ul>
        </div>
        <div class="lose">
            <h1 class="lose-text"></h1>
        </div>
        <img class="forest" src="./img/forest.jpe" alt="">
        <div class="frog"></div>
    </div>
    <script src="main.js"></script>
</body>
</html>
